name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # By hand, as `gh workflow run ci.yml --ref main`. Without this, a run that
  # GitHub never starts can only be replaced by pushing a commit: on 2026-09-13
  # the run for f9a2614 sat queued with no jobs, cancel and force-cancel both
  # refused it, and the deploy had no other way to happen.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # Deployment is handled by Vercel's Git integration (push → build → deploy),
  # not GitHub Actions — see docs/deploy-vercel.md. The old Cloudflare Pages
  # deploy job was removed for this fork: it needed CLOUDFLARE_* secrets this
  # repo doesn't have, so on a fork it would only ever fail the CI run.
  # CI here is purely a quality gate (typecheck · lint · test · build · coverage).
